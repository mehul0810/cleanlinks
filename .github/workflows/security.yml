name: Security

on:
    # Run on all pushes and on all pull requests.
    push:
    pull_request:
    # Also run this workflow every Monday at 6:00.
    schedule:
        - cron: '0 6 * * 1'
    # Allow manually triggering the workflow.
    workflow_dispatch:

permissions:
    contents: read

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    security:
        name: 'Security check'
        runs-on: ubuntu-latest

        # Don't run the cronjob in this workflow on forks.
        if: github.event_name != 'schedule' || (github.event_name == 'schedule' && github.repository_owner == 'mehul0810')

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
                  fetch-depth: 0

            # This action checks the `composer.lock` file against known security vulnerabilities in the dependencies.
            # https://github.com/marketplace/actions/the-php-security-checker
            - name: Run Security Check
              uses: symfonycorp/security-checker-action@bb5092fdb50d4b92d301885fb6d0b0a41cea7bcd # v4

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '24'

            - name: Audit npm lockfile, including build dependencies
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: node scripts/check-npm-audit-delta.mjs
