name: Deploy to WordPress.org

on:
  release:
    types: [ released ]

permissions:
  contents: read

jobs:
  tag:
    name: New release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Install composer dependencies
        uses: php-actions/composer@c3a242874c6e7bb78d28e8d26476b7aa53f7a304 # v2
        with:
          dev: no

      - uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: |
          npm ci
          sudo npm run build

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: cleanlinks

      - name: Upload release asset
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{github.workspace}}/cleanlinks.zip
          asset_name: ${{ github.event.repository.name }}.zip
          asset_content_type: application/zip
