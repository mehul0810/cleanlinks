name: Build Plugin Pre-Release

on:
  release:
    types: [ prereleased ]

permissions:
  contents: read

jobs:
  build:
    name:    Build Plugin Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install composer dependencies
        uses: php-actions/composer@c3a242874c6e7bb78d28e8d26476b7aa53f7a304 # v2
        with:
          dev: no

      - uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: |
          npm ci
      - name: Generate plugin artifact
        run: |
          npm run package:release -- "${GITHUB_WORKSPACE}/cleanlinks.zip"
      - name: Upload release asset
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{github.workspace}}/cleanlinks.zip
          asset_name: ${{ github.event.repository.name }}.zip
          asset_content_type: application/zip
